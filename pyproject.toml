[tool.poetry]
name = "data-planning-agent"
version = "0.1.0"
description = "An MCP agent that transforms high-level business intents into structured Data Product Requirement Prompts through conversational refinement"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "data_planning_agent", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
google-generativeai = "^0.8.0"
google-cloud-storage = "^2.10.0"
mcp = "^1.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"
rich = "^13.0.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
pytest-asyncio = "^0.21.2"
pytest-mock = "^3.11.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
planning-agent = "data_planning_agent.cli.interactive:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "unit",
    "integration",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

